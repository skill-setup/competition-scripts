      - "traefik.http.routers.comp01_module_b.entrypoints=websecure"
      - "traefik.http.routers.comp01_module_b.tls=true"
      - "traefik.http.services.comp01_module_b.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"
  comp02_module_a:
